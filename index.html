<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Doom Scroll</title>
<link rel="icon" type="image/png" href="https://sandboxmedia.com.au/wp-content/uploads/2024/06/TikTok-Advertising-Agency-200x200-1.png">
<link rel="apple-touch-icon" href="https://sandboxmedia.com.au/wp-content/uploads/2024/06/TikTok-Advertising-Agency-200x200-1.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo-block">
      <img src="https://sandboxmedia.com.au/wp-content/uploads/2024/06/TikTok-Advertising-Agency-200x200-1.png" alt="PlatypusScroll logo">
      <span class="wordmark">Doom<span>Scroll</span></span>
    </div>

    <div class="sidebar-label">Feed</div>
    <button class="nav active" id="homeBtn">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V19.5A1.5 1.5 0 0 1 19.5 21H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav" id="refreshBtn">
      <svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 7.2L4 11m2 4A7 7 0 0 0 18 16.8L20 13"/></svg>
      <span>Refresh</span>
    </button>
    <button class="nav" id="soundBtn">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/></svg>
      <span>Sound on</span>
    </button>

    <div class="spacer"></div>

    <button class="nav" id="aboutBtn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01" stroke-linecap="round"/></svg>
      <span>About</span>
    </button>
  </aside>

  <main class="feed-shell">
    <div class="topbar">
      <span class="topbar-title">For You</span>
      <i class="api-dot" id="apiDot"></i>
    </div>
    <div class="feed" id="feed"></div>
    <nav class="mobile-nav">
      <button id="mHome">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V19.5A1.5 1.5 0 0 1 19.5 21H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg>
      </button>
      <button id="mRefresh">
        <svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 7.2L4 11m2 4A7 7 0 0 0 18 16.8L20 13"/></svg>
      </button>
      <button id="mSound">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9.5a4 4 0 0 1 0 5"/></svg>
      </button>
      <button id="mAbout">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg>
      </button>
    </nav>
  </main>

  <aside class="rightbar">
    <div class="card">
      <div class="panel-label">Region</div>
      <select id="region">
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="CA">Canada</option>
        <option value="AU">Australia</option>
        <option value="JP">Japan</option>
        <option value="KR">South Korea</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
        <option value="BR">Brazil</option>
        <option value="MX">Mexico</option>
      </select>
      <div class="row">
        <button class="btn btn-primary" id="applyRegion">Apply</button>
        <button class="btn btn-ghost" id="shuffleBtn">Shuffle</button>
      </div>

    <div class="card">
      <div class="panel-label">Proxy</div>
      <p style="font-size:11px;color:#555;line-height:1.5;margin-bottom:10px">Route requests through the Cloudflare Worker if the feed isn't loading.</p>
      <button class="btn btn-ghost" id="proxyToggle" style="width:100%">Enable proxy</button>
    </div>
    </div>
  </aside>
</div>

<div class="backdrop" id="backdrop"></div>

<aside class="drawer" id="commentsDrawer">
  <div class="drawer-head">
    <span id="commentsTitle">Comments</span>
    <button class="close" id="closeComments">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
  </div>
  <div class="comments" id="commentsList"></div>
</aside>

<aside class="profile-drawer" id="profileDrawer">
  <div class="drawer-head">
    <span id="profileTitle">Profile</span>
    <button class="close" id="closeProfile">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
  </div>
  <div class="profile-content" id="profileContent"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
